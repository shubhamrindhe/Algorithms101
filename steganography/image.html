<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
	<meta name="author" content="shubhamrindhe" id="author"/>
	<title>Steganography</title>
	<style>
		body{
			padding:0;
			margin:0;
		}
		canvas{
			position:absolute;
			left:50%;
			top:50%;
			transform:translate(-50%,-50%);
			border: 2px solid black;
		}
		
	</style>
	<script src="./xor_cipher.js"></script>
	<script src="./ghostegano.js"></script>
	<script src="./stegosaurus.js"></script>
	<script>
		
		var IMG_DATA;
		
		window.onload = function() {	
		
			document.getElementById('txt_file').onchange = function (event) {
				
				var file = event.target.files[0];
				console.log(event,file);
				readText(file, function (text) {
					document.getElementById('text').innerHTML = text;
					var data = encode_string(text);
					console.log(data,'decoded : ',decode_string(data));
					//var img_with_data = embed_data_in_image_data(IMG_DATA, text);
					//document.getElementById('img_stego').src = getDataURL(img_with_data);
					//console.log(decode_string(extract_data_from_img_data(img_with_data)));
				});
				
			}
			
			document.getElementById('img_file').onchange = function (event) {
				var file = event.target.files[0];
				if (file.type.match('image.*')) {
					readImage(file, function (dataURL) {
						var img = new Image();
						img.src = dataURL;
						var img_data = get_img_data(img);
						IMG_DATA = img_data;
					
						document.getElementById('text').innerHTML = dataURL;
						//document.getElementById('img_original').src = dataURL;
					});
				}
			}
			
			document.getElementById('extract').onclick = function (event) {
				const file = document.getElementById('img_file').files[0];
				if (file) {
					readImage(file, function (dataURL) {
						var img = new Image();
						
						img.onload = function (event) {
							var img_data = get_img_data(img);
						
							console.log(img_data);
							var extracted_text = extract_text_from_img_data(img_data);
							console.log(extracted_text);
							document.getElementById('text').innerHTML = extracted_text;
						}
						
						img.src = dataURL;
					});
				} else {
					alert('Please select image file.');
				}
			}
			
			document.getElementById('embed').onclick = function (event) {
				const img_file = document.getElementById('img_file').files[0];
				var text = document.getElementById('text').innerHTML;
				//text = "aaaaa";
				if (!img_file) {
					alert('Please select image file.');
				} else if (text==''){
					alert('Specify text to embed in image file.');
				} else {
					readImage(img_file, function (dataURL) {
						var img = new Image();
						
						img.onload = function (event) {
							console.log(event);
							var img_data = get_img_data(img);
							console.log(img_data);
							var img_data_with_text = embed_data_in_image_data(img_data, text);
							console.log(extract_text_from_img_data(img_data_with_text));
							
							console.log(img_data_with_text);
							savePNG(img_data_with_text);
							//document.getElementById('img_stego').src = getDataURL(img_data_with_text);
						}
						
						img.src = dataURL;
					});
				}
			}
		};
		
		function readImage(file, callback) {
			readFile(file, 'readAsDataURL', callback);
		}
		
		function readText(file, callback) {
			readFile(file, 'readAsText', callback);
		}
		
		function readFile(file, readAs = 'readAsText', callback) {
			const fileReader = new FileReader();
			fileReader.onloadend = function (event) {
				callback(event.target.result);
			}
			fileReader[readAs](file);
		}
	</script>
</head>
<body>	
	<input type="file" id="txt_file"/>
	<input type="file" id="img_file"/>
	
	<img id="img_original" width="300px" height="300px">
	<img id="img_stego" width="300px" height="300px">
	
	<button id="extract">EXTRACT</button>
	<button id="embed">EMBED</button>
	
	<pre id="text"></pre>
</body>
</html>
