<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
	<meta name="author" content="shubhamrindhe" id="author"/>
	<title>Ghostegano</title>
	<style>
	*,body{
		padding: 0;
		margin: 0;
	}
	#canvas{
		z-index: -10;
	}
	.wrapper{
		width: 250px;
		position: absolute;
		top:10px;
		left: 50%;
		transform: translate(-50%,0);
	}
	
	
	div{
		position:absolute;
		width:33%;
		overflow:visible;
	}
	.center{
		left:50%;
		transform:translate(-50%,0);
	}
	
	#random{
		position:absolute ;
		left:10px;
		top:10px;
		padding:10px;
		background-color:rgba(0,0,0,0.3);
		color:#fff;
		cursor:grab;
	}
	#random:hover{
		background:rgba(0,0,0,0.8);
		color:#fff;	
		border-radius:5px;
	}
	#go{
		position:absolute ;
		right:10px;
		top:10px;
		padding:10px;
		background-color:rgba(0,0,0,0.3);
		color:#fff;
		cursor:grab;
	}
	#go:hover{
		background:rgba(0,0,0,0.8);
		color:#fff;	
		border-radius:5px;
	}
	
	#displayAngle{
		position: relative;
		width: 100%;
		text-align: center;
		/*background: #ccc;*/
	}

	input.slider[type=range]{
		-webkit-apperance:none;
		width: 100%;
	}
	input.slider[type=range]::-moz-range-track{
		width: 100%;
		height: 10px;
		background: #212121;
		border-radius: 5px  ;
	}
	input.slider[type=range]::-moz-range-thumb{
		width: 10px;
		height: 10px;
		background: white;
		border-radius: 50%;
		border: 1px solid black;
		position: relative;
		display: inline-block;
		transition: all 0.2s ease-in-out;
		cursor:grab;
	}
	input.slider[type=range]::-moz-range-thumb:hover{
		width: 22px;
		height: 22px;
	}
	input.slider[type=range]::-moz-range-thumb:active{
		width: 20px;
		height: 20px;
		background: #00bcd4;
	}
	</style>

	
</head>
	<body>
		<canvas id="canvas"></canvas>
		<center>
			<table id="clr"></table>
		</center>
	</body>
	
	<script type="text/javascript">

	var canvas,ctx;
	var height = innerWidth < innerHeight ? 50 : 80;
	var t;

	window.onload = function(){
		initCanvas();
		
		t = document.getElementById('clr');
		var colors = "";
		var color_count = 0;
		for (var r=0;r<=255;r+=85) {
			for (var g=0;g<=255;g+=85) {
				for (var b=0;b<=255;b+=85) {
					
					colors += '<tr style="border:solid red 1px">';
					colors += '<td>'+color_count+'</td>';
					for (var alpha=0;alpha<=1;alpha+=0.33) {
						colour = 'rgba('+r+','+g+','+b+','+alpha+')';
						colors += '<td style="background:'+colour+'">'+colour+'</td>';
					}
					colors += "</tr>";
					++color_count;
				}
			}
		}

		t.innerHTML = colors;
	}
	
	function initCanvas(){
		canvas = document.getElementById('canvas');
		ctx = canvas.getContext('2d');
		canvas.style.position = 'absolute';
		canvas.style.left = '50%';
		canvas.style.top = '50%';
		canvas.style.transform = 'translate(-50%,-50%)';
		canvas.style.backgroundColor = 'lightblue';
		canvas.width = innerWidth;
		canvas.height = innerHeight;
	}

	function random(a,b){
		return a + (b-a)*Math.random();
	}	
	</script>
</html>
