<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
	<meta name="author" content="shubhamrindhe" id="author"/>
	<title>ghostegg</title>
	<style>
		body{
			padding:0;
			margin:0;
		}
		
		canvas{
			position:absolute;
			left:50%;
			top:50%;
			transform:translate(-50%,-50%);
			border: 2px solid black;
		}
		
		#logo {
			font-family:Courier New;
			font-size:15px;
			font-family:verdana;
			letter-spacing:4px;
		}
		
		#logo:hover > #_steg_ {
			text-decoration:underline;
		}
		
		/*
		#logo:hover > #_g_:before {
			content:'ano';
			font-size:10px;
		}
		
		#logo:hover > #_g_:after {
			content:'raphy';
			font-size:10px;
		}
		*/
		
		input[type="checkbox"]:not(:checked) + label > #_g_:before,
		input[type="checkbox"]:not(:checked) + label > #_g_:after {
			content:'';
			display : none;
		}
		
		input[type="checkbox"]:checked + label > #_g_:before {
			content:'ano';
			font-size:10px;
			display : inline-block;
		}
		
		input[type="checkbox"]:checked + label > #_g_:after {
			content:'raphy';
			font-size:10px;
			display : inline-block;
		}
		
		
		
		input[type="checkbox"]{
			transition-duration:0.1s;
		}
		
		label {
			/*text-decoration:underline;*/
		}
		
		
		.hidden {
			display:none;
		}
		
		/*
		input[type="checkbox"]:not(:checked) + label > span.hidden {
			display : none;
		}
		
		input[type="checkbox"]:checked + label > span.hidden {
			display : inline-block;
		}
		*/
		
		input[type="checkbox"]:not(:checked) + label > span.fade {
			opacity: 1;
		}
		
		input[type="checkbox"]:checked + label > span.fade {
			opacity: 0.1;
			text-decoration:line-through;
			font-weight:900;	
		}
		
		input[type="checkbox"]:checked + label {
			font-weight:900;	
		}
		
		input[type="checkbox"]{
			display : none;
		}
		
		.hidden, .fade {
			transition-duration:0.4s;
		}
		
		#information{
			font-family:Courier New;
		}
		
		#information > div {
			padding:20px 20px 20px 20px;
		}
		
		#population{
			font-family:Courier New;
			overflow:scroll;
			background:#ccc;
		}
		
		@media only screen and (min-width: 1050px) {
			#information{
				position : fixed;
				width :50%;
				top : 50%;
				transform : translate(0,-50%);
			}
			
			#population{
				width : 50%;
				float : right;
			}
		}
		
		
		
		
		input.steg_file:invalid ~ input.steg_file:invalid{
			display:none;
		}
		
		input.steg_file[type=file][value=""] + label {
			background-color: red;
			color: blue;
			border-style: dashed;
		}
		
		/*
		input:not([value]), div:not([value]) {
		   background-color: #F88;
		}

		input[value], div[value] {
		   border: 5px solid #8F8;
		}
		
		input[value=""], div[value=""] {
		   border: 5px solid #F8F;
		}

		input:not([value=""]), div:not([value=""]) {
		   color: blue;
		   border-style: dashed;
		}
		*/
		
		
	</style>
	<script src="./xor_cipher.js"></script>
	<script src="./ghostegano.js"></script>
	<script src="./stegosaurus.js"></script>
	<script>
		var stegosaurus;
		window.onload = function() {	
			stegosaurus = new Stegosaurus();
		
			document.getElementById('txt_file').onchange = function (event) {
				
				var file = event.target.files[0];
				console.log(event,file);
				readText(file, function (text) {
					document.getElementById('text').innerHTML = text;
					var data = encode_string(text);
					console.log(data,'decoded : ',decode_string(data));
					//var img_with_data = embed_data_in_image_data(IMG_DATA, text);
					//document.getElementById('img_stego').src = getDataURL(img_with_data);
					//console.log(decode_string(extract_data_from_img_data(img_with_data)));
				});
				
			}
			
			document.getElementById('img_file').onchange = function (event) {
				var file = event.target.files[0];
				if (file.type.match('image.*')) {
					readImage(file, function (dataURL) {
						var img = new Image();
						img.src = dataURL;
						var img_data = get_img_data(img);
					
						document.getElementById('text').innerHTML = dataURL;
						//document.getElementById('img_original').src = dataURL;
					});
				}
			}
			
			document.getElementById('extract').onclick = function (event) {
				const file = document.getElementById('img_file').files[0];
				if (file) {
					readImage(file, function (dataURL) {
						var img = new Image();
						
						img.onload = function (event) {
							var img_data = get_img_data(img);
						
							console.log(img_data);
							//var extracted_text = extract_text_from_img_data(img_data);
							var extracted_text = stegosaurus.extract_text_from_img_data(img_data);
							console.log(extracted_text);
							document.getElementById('text').innerHTML = extracted_text;
						}
						
						img.src = dataURL;
					});
				} else {
					alert('Please select image file.');
				}
			}
			
			document.getElementById('embed').onclick = function (event) {
				const img_file = document.getElementById('img_file').files[0];
				var text = document.getElementById('text').innerHTML;
				//text = "aaaaa";
				if (!img_file) {
					alert('Please select image file.');
				} else if (text==''){
					alert('Specify text to embed in image file.');
				} else {
					readImage(img_file, function (dataURL) {
						var img = new Image();
						
						img.onload = function (event) {
							console.log(event);
							var img_data = get_img_data(img);
							console.log(img_data);
							//var img_data_with_text = embed_data_in_image_data(img_data, text);
							var img_data_with_text = stegosaurus.embed_text_in_img_data(img_data, text);
							console.log(extract_text_from_img_data(img_data_with_text));
							
							console.log(img_data_with_text);
							savePNG(img_data_with_text);
							//document.getElementById('img_stego').src = getDataURL(img_data_with_text);
						}
						
						img.src = dataURL;
					});
				}
			}
			
			document.onselectionchange = egg;
			//document.getElementById('logo').onselectionchange = egg;
		};
		
		function readImage(file, callback) {
			readFile(file, 'readAsDataURL', callback);
		}
		
		function readText(file, callback) {
			readFile(file, 'readAsText', callback);
		}
		
		function readFile(file, readAs = 'readAsText', callback) {
			const fileReader = new FileReader();
			fileReader.onloadend = function (event) {
				callback(event.target.result);
			}
			fileReader[readAs](file);
		}
		
		function egg (event) {
			var selectedText = "";
			if (typeof window.getSelection() != "undefined") {
				selectedText = window.getSelection().toString();
			} else if (typeof document.getSelection() != "undefined") {
				selectedText = document.getSelection().toString();
			}
			//console.log(selectedText);
			
			if (selectedText == "steg") {
				setTimeout(function () {
					document.getElementById('egg-status').checked = true;
				},1011);
			} else {
				document.getElementById('egg-status').checked = false;
			}
		}
	</script>
</head>
<body>
	<center>
		<div id='information'>
			<div>
				<input type="checkbox" id="egg-status"/>
				<label id="logo">
					<span class="fade">gho</span><span id="_steg_">steg</span><span class="hidden">ano</span><span id="_g_">g</span><span class="hidden">raphy</span>
				</label>
			</div>
			
			<div>
				<input type="file" id="txt_file" class="steg_file"/>
				<label for="txt_file">Select Text File</label>
				<input type="file" id="img_file" class="steg_file"/><br>
				<label for="img_file">Select Image File</label>
			</div>
			
			<div>
				<button id="extract">EXTRACT</button>
				<button id="embed">EMBED</button>
			</div>
		</div>
	</center>
		<div id='population'>
			<pre id="text"></pre>
		</div>
	<!--img id="img_original" width="300px" height="300px"-->
	<!--img id="img_stego" width="300px" height="300px"-->
</body>
</html>
