<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
	<meta name="author" content="shubhamrindhe" id="author"/>
    <title>Fourier</title>
    <style>
        body{
			padding:0;
			margin:0;
			font-family:Courier New;
			
			display:flex;
			justify-content:center;
			align-items:center;
			height:100vh;
			
			/*background:#000;*/
		}
		.centroid{
			position:absolute;
			left:50%;
			top:50%;
			transform:translate(-50%,-50%);
		}
		
		#canvas{
			/*width:100%;
			height:100%;
			*/
			/*background:#000;*/
		}
    </style>
	
</head>
<body>

	<canvas id="canvas">
	</canvas>

</body>
    <script type="text/javascript">
	var canvas =  document.getElementById('canvas');
	canvas.width = innerWidth;
	canvas.height = innerHeight;
	var ctx = canvas.getContext('2d');
	
	var time =0;
	
	var wave = []; 
	
	window.onload = function(){
	
		loop();
	}
	
	function loop(){
		requestAnimationFrame(loop);
		
		ctx.clearRect(0,0,canvas.width,canvas.height);
		
		ctx.save();
		ctx.translate(500,canvas.height/2);
			
		var x=0;
		var y=0;
		var n = 1;
		var radius = 100;
		
		for(var i=0;i<10;++i){
			var prevx =x;
			var prevy =y;
			/*
			var n = i*2+1;
			
			var rad = radius * ( 4 / (Math.PI*n) );
			x += rad * Math.cos(n*time);
			y += rad * Math.sin(n*time);
			*/
			
			var n = (i+1)*2;
			var rad = radius * ( 2 /( Math.PI*n ));
			//var rad = radius * ( 2 /( (n%2!=0?-Math.PI*n:Math.PI*n) ));
			x += rad * Math.cos(n*time);
			y += rad * Math.sin(n*time);
			
			arc(prevx,prevy,rad,0,Math.PI*2,'black',false);
			arc(x,y,4,0,Math.PI*2,'black',true);
			
			ctx.beginPath();
			ctx.moveTo(prevx,prevy);
			ctx.lineWidth = 5;
			ctx.lineCap = 'round';
			ctx.lineTo(x,y);
			ctx.stroke();
			ctx.closePath();
		}
		wave.unshift(y);

		if(wave.length>500)
			wave.pop();

		ctx.save();
		
		ctx.beginPath();
		ctx.moveTo(x,y);
		ctx.translate(200,0);
		ctx.strokeStyle = 'red';
		ctx.lineCap = 'round';
		ctx.lineWidth = 3;
		for(var i=0;i<wave.length;++i){
			ctx.lineTo(i,wave[i]);
		}
		ctx.stroke();
		//ctx.closePath();
		ctx.restore();
		ctx.restore();
		time += 0.03;
		
		if(time<0){
			time = Math.PI*2 - time;
		}
		else if(time>Math.PI*2){
			time = time - Math.PI*2;
		}
	
	}
	
	function arc(x,y,r,i,e,color,fill){
		ctx.beginPath();
		ctx.arc(x,y,r,i,e);
		ctx.strokeStyle = color;
		ctx.fillStyle = color;
		ctx.lineWidth = 1;
		if(fill)
			ctx.fill();
		else	
			ctx.stroke();
		ctx.closePath();
	}
    </script>
</html>
