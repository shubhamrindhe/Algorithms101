<script type="module">
	onload = async () => {
		const urlSearchParams = new URLSearchParams(window.location.search);
		const params = Object.fromEntries(urlSearchParams.entries());

		const solutionScript = urlSearchParams.get('$') || urlSearchParams.get('s') || urlSearchParams.get('q');

		if (Boolean(solutionScript)) {
			try {
				const prosolutionScriptModule = await import(`./${solutionScript}.js`);
				document.body.classList.add('success');
			} catch (e) {
				console.log(e);
				document.body.classList.add('error');
			}
		}
	}
