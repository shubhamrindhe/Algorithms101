<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
	<meta name="author" content="shubhamrindhe" id="author"/>
	<title>Gravity | DeviceMotionEvent</title>
	<style>
		body{
			padding:0;
			margin:0;
			background-color:#ccc;
		}
		.centroid{
			position:absolute;
			left:50%;
			top:50%;
			transform:translate(-50%,-50%);
		}
	</style>
</head>
	<body>
		<canvas	id='canvas' class='centroid'></canvas>
	</body>
	
	
	<script type="text/javascript">
	
	var canvas,ctx;
	var particles =[];
	var mouse = {
			x : undefined,
			y : undefined
		};
	var g = {
		x : undefined,
		y : undefined,
		z : undefined
	}
				
	window.onload = function(load){
		
		initCanvas(innerWidth,innerHeight);
		
		particles = [];
		initParticles(particles,50);
		animate();
		
	};
	window.onresize = function(){
			canvas.width = window.innerWidth;
			canvas.height = window.innerHeight;	
			particles = [];
			initParticles(particles,50);
	};
	window.onmousemove = function(evt){
			mouse.x = evt.x;
			mouse.y = evt.y;
	};
	
	if(window.DeviceMotionEvent){
		window.ondevicemotion = function(e){
				g.x = -e.accelerationIncludingGravity.x;
				g.y = e.accelerationIncludingGravity.y;
				g.z = e.accelerationIncludingGravity.z;
				
				Particle.acceleration.x = g.x*0.05;
				Particle.acceleration.y = g.y*0.05;
		};
	}else{
		alert("YOU GOTTA HAVE Accelerometer TO RUN THIS CODE!");
	}
	


	function Particle(x,y,r){
		this.x = x;
		this.y = y;
		this.r = r;
		this.mass = 1;
		this.color = 'rgb('+randomIntFromRange(0,255)+','+randomIntFromRange(0,255)+','+randomIntFromRange(0,255)+')';//'black';
		this.radian = Math.random()*Math.PI*2;
		this.e = 0.8;
		this.speed = 0;
		this.velocity={
			x : this.speed*Math.cos(this.radian), 
			y : this.speed*Math.sin(this.radian) 
		};
		Particle.acceleration = {
			x : 0,
			y : 0
		}
		
				
		this.draw = function(){
			
			ctx.beginPath();
			ctx.strokeStyle = this.color;
			ctx.fillStyle = this.color;
			ctx.lineWidth = 2;
			ctx.arc(this.x,this.y,this.r,0,Math.PI*2,true);
			ctx.stroke();
			ctx.fill();
			ctx.closePath();
			
		}
		this.update = function(particles){
			this.draw();
			
			//collision
			for(var i=0;i<particles.length;++i){
				if( this === particles[i] ) continue;
				if( distance(this.x,this.y,particles[i].x,particles[i].y)- (this.r + particles[i].r )< 0){
						collisionDetect( this , particles[i] );
				}
			}
			
			//wall
			if(this.x >canvas.width-r || this.x<r){
				this.x -= this.velocity.x;
				this.velocity.x = - this.velocity.x*this.e;
				this.x += this.velocity.x;
			}
			if(this.y >canvas.height-r || this.y<r){
				this.y -= this.velocity.y;
				this.velocity.y = - this.velocity.y*this.e;
				this.y += this.velocity.y;
			}
			
			this.x += this.velocity.x;
			this.y += this.velocity.y;

			this.velocity.x += Particle.acceleration.x;
			this.velocity.y += Particle.acceleration.y;	
				
		}
	}
			

	function initParticles(list,n){
		for(var i=0;i<n;++i){
			var rad =10;
			var x=randomIntFromRange(rad,innerWidth-rad);
			var y=randomIntFromRange(rad,innerHeight-rad);
			
			if(i!=0){
				for(var j=0;j<list.length;++j){
					if( distance(x,y,list[j].x,list[j].y)-2*rad < 0){
						x=randomIntFromRange(rad,innerWidth-rad);
						y=randomIntFromRange(rad,innerHeight-rad);
						j=-1;
					}
				}
			}	
			list.push( new Particle(x,y,rad));
		}
	}
	
	function initCanvas(w,h){
		canvas = document.getElementById('canvas');
        canvas.style.position = 'absolute';
        canvas.style.left = '50%';
        canvas.style.top = '50%';
        canvas.style.transform = 'translate(-50%,-50%)';
		canvas.style.backgroundColor = 'white';
                
                
        canvas.width = w;
        canvas.height = h;
        ctx = canvas.getContext('2d');
	}
			

	function animate(){
		window.requestAnimationFrame(animate);
		
		ctx.save();
		
		ctx.fillStyle = 'white';
		ctx.clearRect(0,0,canvas.width,canvas.height);
		
		particles.forEach(function(particle){
			particle.update(particles);
			//particle.draw();
		});
		
		ctx.restore();
	}
	
	
	
	
	function rotate(velocity , angle){
		var rotatedVelociteis = {
			x : velocity.x*Math.cos(angle) - velocity.y*Math.sin(angle) ,
			y : velocity.x*Math.sin(angle) + velocity.y*Math.cos(angle)
		}
		return rotatedVelociteis;
	}
	
	function collisionDetect( particle , otherParticle ){
		const xVelocityDiff = particle.velocity.x - otherParticle.velocity.x;
		const yVelocityDiff = particle.velocity.y - otherParticle.velocity.y;
	
		const xDist = otherParticle.x - particle.x;
		const yDist = otherParticle.y - particle.y;
		
		if( xVelocityDiff*xDist + yVelocityDiff*yDist >= 0 ){
			const angle = -Math.atan2( otherParticle.y - particle.y , otherParticle.x - particle.x );
			
			const m1 = particle.mass;
			const m2 = otherParticle.mass;
			
			const u1 = rotate(particle.velocity,angle);
			const u2 = rotate(otherParticle.velocity,angle);
			
			const v1 = { x : u1.x*(m1-m2)/(m1+m2) + u2.x*(1+particle.e)*m2/(m1+m2) , y : u1.y };
			const v2 = { x : u2.x*(m1-m2)/(m1+m2) + u1.x*(1+particle.e)*m2/(m1+m2) , y : u2.y };
			
			const vFinal1 = rotate(v1,-angle);
			const vFinal2 = rotate(v2,-angle);
			
			particle.velocity.x = vFinal1.x;
			particle.velocity.y = vFinal1.y;
			
			otherParticle.velocity.x = vFinal2.x;
			otherParticle.velocity.y = vFinal2.y;
			
		}
	}
	
		
	function distance(x1,y1,x2,y2){
		var dx = x2-x1;
		var dy = y2-y1;
		return Math.sqrt(dx*dx+dy*dy);
	}

	function randomIntFromRange(a,b){
		return a + Math.floor(Math.random()*(b-a)); 
	}

	</script>
	
</html>
