<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
	<meta name="author" content="shubhamrindhe" id="author"/>
	<title>circularMotion</title>
	<style>
		body{
			padding:0;
			margin:0;
			background-color:#ccc;
		}
		.centroid{
			position:absolute;
			left:50%;
			top:50%;
			transform:translate(-50%,-50%);
		}
	</style>


</head>
	<body>
		<canvas	id='canvas' class='centroid'></canvas>
	</body>
	
	
	<script type="text/javascript">
			
		var canvas,ctx;
		var W,H;
		var colorArray = ['indigo','red','green','blue'];
		var circle = new Array() ;
		var mouse = {
				x : undefined,
				y : undefined
			};
		var center = {
				x : innerWidth/2,
				y : innerHeight/2
			};	
					
		window.onload = function(load){
			
			canvas = document.getElementById('canvas');
			ctx = canvas.getContext('2d');
					
			canvas.width = window.innerWidth;
			canvas.height = window.innerHeight;
			W = canvas.width;
			H = canvas.height;	
			canvas.style.backgroundColor = 'black';
					
					
					
			init();
			animate();
			
		};
		window.onresize = function(){
			canvas.width = window.innerWidth;
			canvas.height = window.innerHeight;	
		};
		window.onmousemove = function(evt){
			mouse.x = evt.x;
			mouse.y = evt.y;
			
			center.x = mouse.x;
			center.y = mouse.y;
		};

		function Particle(x,y,r){
			this.x = x;
			this.y = y;
			this.r = r;
			this.color = 'white';
			this.velocity = randomFloatFromRange(0.025,0.05);
			this.radian = Math.random()*Math.PI*2;
			this.distance = randomIntFromRange(50,120);
			this.threeD = {
				x:randomIntFromRange(50,120),
				y:randomIntFromRange(50,120)
			}
					
			this.draw = lastPt =>{
				//without trail
				/*
				ctx.beginPath();
				ctx.strokeStyle = this.color;
				ctx.fillStyle = this.color;
				//ctx.globalAlpha = .5;
				ctx.arc(this.x,this.y,this.r,0,Math.PI*2,true);
				//ctx.stroke();
				ctx.fill();
				ctx.closePath();
				

				//center
				ctx.beginPath();
				ctx.arc(W/2,H/2,2,0,Math.PI*2,true);
				ctx.fill();
				ctx.closePath();
				*/
						
				//trail
				
				ctx.beginPath();
				ctx.moveTo(lastPt.x,lastPt.y);
				ctx.lineTo(this.x,this.y);
				ctx.strokeStyle= 'white';
				ctx.lineWidth = 2;
				ctx.stroke();
				ctx.closePath();
						
						
			
			}
			this.update = function(){
						
				// motion of pt
				this.radian += this.velocity;
						
				const lastPt ={
					x:this.x,
					y:this.y
				}
						
				/*
				const lastPt ={
					x:W/2,
					y:H/2
				}
				*/
				
				// circular Motion
				this.x = x + Math.cos(this.radian)*this.threeD.x;
				this.y = y + Math.sin(this.radian)*this.threeD.y;
				
				//mousemove
				
				this.x = center.x + Math.cos(this.radian)*this.distance;
				this.y = center.y + Math.sin(this.radian)*this.distance;
					

				this.draw(lastPt);
						
			}

		}
				
		let particles;
		function init(){
			particles=[];
			for(var i=0;i<50;i++){
				particles.push(new Particle(innerWidth/2,innerHeight/2,1));
			}
			//console.log(particles);	
		}
				

		function animate(){
			window.requestAnimationFrame(animate);
			ctx.save();
			//ctx.clearRect(0,0,canvas.width,canvas.height);
			
			//trail Effect
			ctx.fillStyle='rgba(0,0,0,.2)';
			ctx.fillRect(0,0,canvas.width,canvas.height);

			particles.forEach(
				particle => {particle.update();}
			);
			ctx.restore();
		}
				
				
		function randomIntFromRange(a,b){
			return a + Math.floor(Math.random()*(b-a)); 
		}

		function randomFloatFromRange(a,b){
			return a + Math.random()*(b-a); 
		}

				
			
		
	</script>
	
</html>
