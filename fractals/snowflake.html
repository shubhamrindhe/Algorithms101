<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
	<meta name="author" content="shubhamrindhe" id="author"/>
	<title>FractalTree</title>
	<style>
	*,body{
		padding: 0;
		margin: 0;
	}
	#canvas{
		z-index: -10;
	}
	
	div{
		position:absolute;
		width:33%;
	}
	.left{
		left:0;
	}
	.center{
		left:50%;
		transform:translate(-50%,0);
	}
	.right{
		right:0;
	}
	span{
		position:relative;
		text-align:center;
		width:100%;
	}
	
	#displayAngle{
		position: relative;
		width: 100%;
		text-align: center;
		/*background: #ccc;*/
	}

	input.slider[type=range]{
		-webkit-apperance:none;
		width:100%;
	}
	input.slider[type=range]::-moz-range-track{
		width: 100%;
		height: 10px;
		background: #212121;
		border-radius: 5px  ;
	}
	input.slider[type=range]::-moz-range-thumb{
		width: 10px;
		height: 10px;
		background: white;
		border-radius: 50%;
		border: 1px solid black;
		position: relative;
		display: inline-block;
		transition: all 0.2s ease-in-out;
		cursor:grab;
	}
	input.slider[type=range]::-moz-range-thumb:hover{
		width: 22px;
		height: 22px;
	}
	input.slider[type=range]::-moz-range-thumb:active{
		width: 20px;
		height: 20px;
		background: #00bcd4;
	}
	</style>

	
</head>
	<body>
		
		
		<canvas id="canvas"></canvas>
		
	</body>
	
	<script type="text/javascript">

	var canvas,ctx;
	var particle;
	window.onload = function(){
		initCanvas();
		
		particle = new Particle(innerWidth,innerHeight/2);
		
		animate();
	}
	

	function initCanvas(){
		canvas = document.getElementById('canvas');
		ctx = canvas.getContext('2d');
		canvas.style.position = 'absolute';
		canvas.style.left = '50%';
		canvas.style.top = '50%';
		canvas.style.transform = 'translate(-50%,-50%)';
		canvas.style.backgroundColor = 'lightblue';
		canvas.width = innerWidth;
		canvas.height = innerHeight;
	}
	
	function animate(){
		window.requestAnimationFrame(animate);
		particle.update();
		particle.render(ctx);
		
		//ctx.fillRect(innerWidth/2, innerHeight/2, 100, 100);
		/*
		ctx.beginPath();
		ctx.fillStyle = 'green';
		ctx.arc(particle.x, particle.y, 20, 0, Math.PI*2, true);
		ctx.fill();
		ctx.closePath();
		*/
	}
	
	function random(a,b){
		return a + (b-a)*Math.random();
	}
	
	
	class Particle {
		constructor(x, y) {
			this.x = x;
			this.y = y;
		}
		
		update(){
			this.x -= 1;
			this.y += random(-5,5);			
		}
		
		render (ctx) {
			
			ctx.save();

			ctx.beginPath();
			ctx.fillStyle = 'green';
			ctx.arc(this.x, this.y, 10, 0, Math.PI*2, true);
			ctx.fill();
			ctx.closePath();
			
			ctx.restore();

		}
	}

	</script>
	
	
</html>
